  <!-- First paint: show the right view and keep the page hidden until fonts and styles are ready. -->
  <script>
    /* Router bootstrap: show the right view from the very first paint (no flash of other pages). */
    (function () {
      var R = ['home', 'how-it-works', 'kits', 'documents', 'playground', 'roi', 'blog'], h = location.hash, v = 'home', m = h.match(/^#\/([\w-]*)/);
      if (m && R.indexOf(m[1]) > -1) { v = m[1]; } else if (h.length > 1 && R.indexOf(h.slice(1)) > -1) { v = h.slice(1); }
      document.documentElement.setAttribute('data-route', v);
    })();
    /* Progressive reveal: hide [data-rv] blocks only if the reveal script ends up running (failsafe below). */
    document.documentElement.classList.add('js-reveal');
    /* Load guard: keep the page hidden (and animations paused) until fonts + Tailwind are ready; failsafe after 2.5 s. */
    document.documentElement.classList.add('fouc-guard');
    window.__markReady = function () {
      var d = document.documentElement;
      if (d.classList.contains('is-ready')) { return; }
      d.classList.add('is-ready');
      document.dispatchEvent(new Event('elready'));
    };
    setTimeout(window.__markReady, 2500);
    setTimeout(function () { if (!window.__revealOK) { document.documentElement.classList.remove('js-reveal'); } }, 3500);
